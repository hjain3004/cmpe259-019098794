#             else = case-insensitive text
#   evidence  documents the answer should cite, at document level (inv_MN-495,
#             txn_0514, vh_v_ironridge, msg_m03, cn_CN-0921)
#   must_not  phrases that fail the turn (added to the ones in queries.yaml)
#
# Query wording overrides (conversation | original text | override | reason):
# | Conv | Original text | Override | Reason |
# |------|---------------|----------|--------|
# | Q02 (t0) | How much do I owe Northside Supplies as of September 30? | How much do I owe Meadowlark Nursery & Sod as of September 30? | Replace café vendor with landscaping vendor |
# | Q04 (t0) | Did I already pay invoice NS-1048? | Did I already pay invoice MN-495? | Replace café invoice with equivalent paid landscaping invoice |
# | Q05 (t0) | When is the Greenway Produce invoice due? | When is the Rainline Irrigation & Pump invoice RL-215 due? | Replace café vendor with landscaping Net 30 invoice without printed due date |
# | Q06 (t0) | What remains unpaid on GP-228 after the partial payment? | What remains unpaid on RL-215 after the partial payment? | Replace café invoice with landscaping invoice having a partial payment |
# | Q08 (t0) | Show me where the total for NS-1048 came from. | Show me where the total for MN-495 came from. | Replace café invoice with landscaping invoice having subtotal and tax |
# | Q09 (t0) | What invoice matches the $842 bank payment on September 12? | What invoice matches the $878.85 bank payment on September 12? | Replace café payment amount with landscaping payment amount on Sep 12 |
# | Q11 (t0) | Is Northside Supply Co. the same vendor as Northside Supplies? | Is Meadowlark Landscape Supply Inc. the same vendor as Meadowlark Nursery & Sod? | Replace café vendor and alias with landscaping vendor and verified alias |
# | Q12 (t0) | Did the payment details on BW-771 change? | Did the payment details on IR-618 change? | Replace café invoice with landscaping invoice whose remit-to bank changed |
# | Q13 (t0) | Is the amount on BW-771 unusual for this vendor? | Is the amount on IR-618 unusual for this vendor? | Replace café invoice with high-total landscaping invoice |
# | Q14 (t0) | How much did I spend on coffee beans in August? | How much did I spend on grass seed in August? | Replace café product with landscaping line-item product |
# | Q15 (t0) | How many five-pound coffee bags did I purchase in August? | How many 50 lb grass seed bags did I purchase in August? | Replace café item size/product with landscaping item size/product |
# | Q16 (t0) | List every unpaid Northside invoice. | List every unpaid Meadowlark invoice. | Replace café vendor with landscaping vendor |
# | Q17 (t0) | Did I pay the Greenway bill? | Did I pay the Rainline bill? | Replace café vendor with landscaping vendor |
# | Q18 (t1) | The BeanWorks one. | The Ironridge one from September. | Replace café vendor with landscaping vendor and disambiguate September bill IR-618 from August bill IR-602 |
# | Q19 (t1) | Northside. | Meadowlark. | Replace café vendor with landscaping vendor |
# | Q21 (t0) | List my Northside bills from this summer. | List my Meadowlark bills from July and August, oldest first. | Replace café vendor and scope to the 3 summer bills in oldest-first order |
# | Q27 (t0) | Show all invoices from Northside after it changed its legal name. | Show all invoices from Meadowlark after it changed its legal name. | Replace café vendor with landscaping vendor that changed its legal name on Sep 1 |
# | Q29 (t0) | How many coffee bags do I have in stock right now? | How many grass seed bags do I have in stock right now? | Replace café product with landscaping product |

