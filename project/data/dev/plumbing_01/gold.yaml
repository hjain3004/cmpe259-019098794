# | Q06 (t0) | What remains unpaid on GP-228 after the partial payment? | What remains unpaid on MV-309 after the partial payment? | Replace café invoice with plumbing invoice having a partial payment |
# | Q08 (t0) | Show me where the total for NS-1048 came from. | Show me where the total for CP-418 came from. | Replace café invoice with plumbing invoice having subtotal and tax |
# | Q09 (t0) | What invoice matches the $842 bank payment on September 12? | What invoice matches the $788.40 bank payment on September 12? | Replace café payment amount with plumbing payment amount on Sep 12 |
# | Q11 (t0) | Is Northside Supply Co. the same vendor as Northside Supplies? | Is Crestline Flow Systems LLC the same vendor as Crestline Pipe & Supply? | Replace café vendor and alias with plumbing vendor and verified alias |
# | Q12 (t0) | Did the payment details on BW-771 change? | Did the payment details on SB-522 change? | Replace café invoice with plumbing invoice whose remit-to bank changed |
# | Q13 (t0) | Is the amount on BW-771 unusual for this vendor? | Is the amount on SB-522 unusual for this vendor? | Replace café invoice with high-total plumbing invoice |
# | Q14 (t0) | How much did I spend on coffee beans in August? | How much did I spend on copper pipe in August? | Replace café product with plumbing line-item product |
# | Q15 (t0) | How many five-pound coffee bags did I purchase in August? | How many 3/4 in Type L copper pipe lengths did I purchase in August? | Replace café item size/product with plumbing item size/product |
# | Q16 (t0) | List every unpaid Northside invoice. | List every unpaid Crestline invoice. | Replace café vendor with plumbing vendor |
# | Q17 (t0) | Did I pay the Greenway bill? | Did I pay the Meridian bill? | Replace café vendor with plumbing vendor |
# | Q18 (t1) | The BeanWorks one. | The Summit Brass one from September. | Replace café vendor with plumbing vendor and disambiguate September bill SB-522 from August bill SUM-44 |
# | Q19 (t1) | Northside. | Crestline. | Replace café vendor with plumbing vendor |
# | Q21 (t0) | List my Northside bills from this summer. | List my Crestline bills from July and August, oldest first. | Replace café vendor and scope to the 3 summer bills in oldest-first order |
# | Q27 (t0) | Show all invoices from Northside after it changed its legal name. | Show all invoices from Crestline after it changed its legal name. | Replace café vendor with plumbing vendor that changed its legal name on Sep 1 |
# | Q29 (t0) | How many coffee bags do I have in stock right now? | How many copper pipe lengths do I have in stock right now? | Replace café product with plumbing product |

